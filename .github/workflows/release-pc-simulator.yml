name: Release PC Simulator

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2 via vcpkg
        run: |
          vcpkg install sdl2:x64-windows

      - name: Configure CMake
        run: |
          cmake -S pc_simulator -B pc_simulator/build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: |
          cmake --build pc_simulator/build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          $pkg = "pc_simulator/package"
          md $pkg/sim_data -Force

          # 复制 exe 及其依赖
          Copy-Item pc_simulator/build/Release/shopping_sim.exe $pkg/
          # SDL2.dll 可能在 build 输出目录或 vcpkg 安装目录
          $sdl2_sources = @(
            "pc_simulator/build/Release/SDL2.dll",
            "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/SDL2.dll"
          )
          foreach ($src in $sdl2_sources) {
            if (Test-Path $src) { Copy-Item $src $pkg/; break }
          }

          # 复制仓库中的商品图片和背景图
          Copy-Item pc_simulator/sim_data/*.bin $pkg/sim_data/

          # 生成默认数据文件
          "" | Out-File -Encoding ascii $pkg/sim_data/transactions.csv
          # 优惠券默认值：无优惠=-1，其余4种各10张
          "-1,10,10,10,10" | Out-File -Encoding ascii $pkg/sim_data/coupon.dat
          # 价格默认值（单位：分，即 8.00,6.00,10.00,3.00,3.00,40.00 元）
          "800,600,1000,300,300,4000" | Out-File -Encoding ascii $pkg/sim_data/price.dat

      - name: Create ZIP
        run: |
          Compress-Archive -Path pc_simulator/package/* -DestinationPath pc_simulator/shopping_sim_${{ github.ref_name }}.zip

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: pc_simulator/shopping_sim_${{ github.ref_name }}.zip
          tag: ${{ github.ref_name }}
          overwrite: true
